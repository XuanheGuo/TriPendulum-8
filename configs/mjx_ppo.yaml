env:
  frame_skip: 4
  max_episode_steps: 1000
  x_max: 4.8
  f_max: 40.0
  omega_limit: 30.0
  stable_x_threshold: 3.2
  pose_threshold: 0.08
  omega_threshold: 1.0
  stable_steps_required: 25
  post_success_steps: 100
  collision_penalty: 250.0
  initial_pose_fractions: [1.0, 0.5, 0.25, 0.0]
  initial_pose_probabilities: [0.4, 0.3, 0.2, 0.1]
  reward:
    w_pose: 4.0
    w_vel: 0.005
    w_act: 0.0002
    w_track: 6.0
    w_boundary: 25.0
    w_outward: 2.0
    w_pose_progress: 8.0
    w_swing_energy: 0.03
    w_upright_height: 2.0
    w_stability: 6.0
    w_spin: 0.002
    w_delta_a: 0.0001
    soft_boundary_ratio: 0.7
    swing_velocity_cap: 8.0
    stability_pose_scale: 4.0
    stability_velocity_scale: 0.05
    success_bonus: 50.0

curriculum:
  stages:
    - goals: ["DDD"]
      timesteps: 50000000
    - goals: ["DDD", "DDU", "DUD", "UDD"]
      timesteps: 150000000
    - goals: ["DDD", "DDU", "DUD", "UDD", "DUU", "UDU", "UUD", "UUU"]
      timesteps: 300000000

ppo:
  num_timesteps: 500000000
  num_envs: 4096
  episode_length: 1000
  num_evals: 20
  learning_rate: 0.0003
  discounting: 0.99
  entropy_cost: 0.01
  reward_scaling: 0.1
  unroll_length: 20
  batch_size: 2048
  num_minibatches: 32
  num_updates_per_batch: 4
  normalize_observations: true
  hidden_layer_sizes: [256, 256, 256]
  seed: 42

paths:
  output_dir: outputs/mjx_ppo
  checkpoint_dir: outputs/mjx_ppo/checkpoints
  log_dir: outputs/mjx_ppo/logs
