env:
  frame_skip: 4
  max_episode_steps: 1000
  x_max: 4.8
  f_max: 40.0
  omega_limit: 50.0
  stable_x_threshold: 3.2
  pose_threshold: 0.08
  omega_threshold: 1.0
  stable_steps_required: 25
  post_success_steps: 100
  collision_penalty: 250.0
  initial_pose_fractions: [1.0, 0.5, 0.25, 0.0]
  initial_pose_probabilities: [0.5, 0.3, 0.15, 0.05]
  reward:
    w_pose: 8.0
    w_vel: 0.002
    w_act: 0.0001
    w_track: 1.0
    w_boundary: 20.0
    w_outward: 0.2
    w_pose_progress: 10.0
    w_swing_energy: 0.1
    w_upright_height: 1.0
    w_stability: 20.0
    w_spin: 0.0
    w_delta_a: 0.00005
    soft_boundary_ratio: 0.7
    swing_velocity_cap: 12.0
    stability_pose_scale: 6.0
    stability_velocity_scale: 0.05
    success_bonus: 500.0

# Difficulty-based curriculum: ALL 8 goals trained at every stage.
# Stages vary how close the initial position is to the goal (pose fraction).
# Stage 1: 80% near-goal starts → policy learns what each goal looks like stabilized
# Stage 2: 50% near-goal → learns to recover from moderate deviations
# Stage 3: full distribution → learns complete swing-up from arbitrary starts
curriculum:
  stages:
    - goals: ["DDD", "DDU", "DUD", "UDD", "DUU", "UDU", "UUD", "UUU"]
      initial_pose_probabilities: [0.8, 0.15, 0.05, 0.0]
      timesteps: 100000000
    - goals: ["DDD", "DDU", "DUD", "UDD", "DUU", "UDU", "UUD", "UUU"]
      initial_pose_probabilities: [0.5, 0.3, 0.15, 0.05]
      timesteps: 150000000
    - goals: ["DDD", "DDU", "DUD", "UDD", "DUU", "UDU", "UUD", "UUU"]
      initial_pose_probabilities: [0.1, 0.3, 0.3, 0.3]
      timesteps: 250000000

ppo:
  num_timesteps: 500000000
  num_envs: 4096
  episode_length: 1000
  num_evals: 20
  learning_rate: 0.0003
  discounting: 0.99
  entropy_cost: 0.005
  reward_scaling: 0.01
  unroll_length: 20
  batch_size: 2048
  num_minibatches: 32
  num_updates_per_batch: 4
  normalize_observations: true
  hidden_layer_sizes: [256, 256, 256]
  seed: 42

paths:
  output_dir: outputs/mjx_ppo
  checkpoint_dir: outputs/mjx_ppo/checkpoints
  log_dir: outputs/mjx_ppo/logs
