env:
  max_episode_steps: 1000
  frame_skip: 4
  render_mode: null
  seed: 42
  x_max: 2.4
  f_max: 40.0
  omega_limit: 30.0
  stable_x_threshold: 1.8
  pose_threshold: 0.08
  omega_threshold: 1.0
  stable_steps_required: 25
  collision_penalty: 100.0
  random_initial_state: false
  initial_angle_noise: 0.05
  initial_velocity_noise: 0.05
reward:
  w_pose: 4.0
  w_vel: 0.05
  w_act: 0.001
  w_track: 1.0
  w_spin: 0.02
  w_delta_a: 0.01
  lambda_x: 1.0
  lambda_omega: 1.0
  lambda_delta_a: 1.0
  success_bonus: 50.0
paths:
  checkpoint_dir: checkpoints
  tensorboard_dir: runs
curriculum:
  enabled: false
  stage: 4
eval:
  enabled: false
  eval_freq: 50000
  n_eval_episodes: 5
  best_model_save_path: checkpoints
  log_path: runs/eval
diagnostic_video:
  enabled: true
  eval_freq: 50000
  max_steps: 1000
  n_eval_episodes: 3
  save_dir: "videos/diagnostics"
  fps: 30
  mode: "curriculum_worst"
  worst_k: 2
  fallback_goals:
    - DDD
    - UUU
