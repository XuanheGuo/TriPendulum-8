[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tripendulum_8"
version = "0.1.0"
description = "Goal-Conditioned RL controller for Cart-Triple Pendulum under MuJoCo"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.21.0",
    "matplotlib>=3.4.0",
    "pyyaml>=5.4.1",
    "gymnasium[mujoco]>=0.28.1",
    "stable-baselines3[extra]>=2.0.0",
    "tensorboard>=2.10.0",
    "imageio>=2.9.0",
    "imageio-ffmpeg>=0.4.5",
    "tabulate>=0.8.9",
    "pandas>=1.3.0",
    "seaborn>=0.11.0",
    "click>=8.0.0"
]

[tool.setuptools]
packages = ["envs", "utils", "training", "analytics", "evaluation", "dashboard"]
